name: Build, Test & Deploy (Cloudflare)

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main, staging]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Cloudflare environment to deploy'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build

  deploy-staging:
    needs: verify
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/staging') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Cloudflare credentials
        id: cf_check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping staging deploy: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Repository Secrets to enable auto-deploy."
          elif grep -q "REPLACE_WITH_STAGING_D1_DATABASE_ID" wrangler.jsonc; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping staging deploy: replace REPLACE_WITH_STAGING_D1_DATABASE_ID in wrangler.jsonc first."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cf_check.outputs.ready == 'true'
        run: npm install --no-audit --no-fund && npm run build
      - if: steps.cf_check.outputs.ready == 'true'
        name: Apply D1 Migrations (Staging)
        run: npx wrangler d1 migrations apply family_dashboard_db_staging --remote --env staging --force
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - if: steps.cf_check.outputs.ready == 'true'
        name: Deploy Worker (Staging)
        run: npx wrangler deploy --env staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - if: steps.cf_check.outputs.ready == 'true'
        name: Sync Optional App Secrets (Staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          INITIAL_ADMIN_EMAIL: ${{ secrets.INITIAL_ADMIN_EMAIL }}
        run: |
          for key in SESSION_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET INITIAL_ADMIN_EMAIL; do
            val="${!key}"
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx wrangler secret put "$key" --env staging
            fi
          done

  deploy-production:
    needs: verify
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Cloudflare credentials
        id: cf_check
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CF_TOKEN" ] || [ -z "$CF_ACCOUNT" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping production deploy: add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in GitHub Repository Secrets."
          elif grep -q "REPLACE_WITH_PROD_D1_DATABASE_ID" wrangler.jsonc; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping production deploy: replace REPLACE_WITH_PROD_D1_DATABASE_ID in wrangler.jsonc first."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.cf_check.outputs.ready == 'true'
        run: npm install --no-audit --no-fund && npm run build
      - if: steps.cf_check.outputs.ready == 'true'
        name: Apply D1 Migrations (Production)
        run: npx wrangler d1 migrations apply family_dashboard_db --remote --env="" --force
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - if: steps.cf_check.outputs.ready == 'true'
        name: Deploy Worker (Production)
        run: npx wrangler deploy --env=""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - if: steps.cf_check.outputs.ready == 'true'
        name: Sync Optional App Secrets (Production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          INITIAL_ADMIN_EMAIL: ${{ secrets.INITIAL_ADMIN_EMAIL }}
        run: |
          for key in SESSION_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET INITIAL_ADMIN_EMAIL; do
            val="${!key}"
            if [ -n "$val" ]; then
              printf '%s' "$val" | npx wrangler secret put "$key" --env=""
            fi
          done
